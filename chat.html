<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat IA ✦</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --c1: #ff6b6b;
        --c2: #ffd93d;
        --c3: #6bcb77;
        --c4: #4d96ff;
        --c5: #ff6bdf;
        --bg: #0e0b1e;
        --surface: #14102b;
        --card: #1c1735;
        --border: #2e2756;
        --text: #f0ecff;
        --muted: #7b74a8;
        --r: 20px;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Nunito", sans-serif;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse 60% 50% at 10% 20%,
            rgba(255, 107, 107, 0.18) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 60% at 85% 10%,
            rgba(77, 150, 255, 0.2) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 70% 50% at 50% 90%,
            rgba(107, 203, 119, 0.15) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse 55% 55% at 90% 75%,
            rgba(255, 107, 223, 0.18) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 40% 40% at 30% 60%,
            rgba(255, 217, 61, 0.1) 0%,
            transparent 50%
          );
        pointer-events: none;
        z-index: 0;
        animation: meshShift 12s ease-in-out infinite alternate;
      }
      @keyframes meshShift {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0.7;
          transform: scale(1.04);
        }
      }

      .confetti {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        animation: floatUp linear infinite;
      }
      @keyframes floatUp {
        0% {
          transform: translateY(110vh) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 0.5;
        }
        100% {
          transform: translateY(-10vh) rotate(720deg);
          opacity: 0;
        }
      }

      #app {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 820px;
        margin: 0 auto;
        padding: 0 16px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 0 16px;
        border-bottom: 2px solid transparent;
        border-image: linear-gradient(
            90deg,
            var(--c1),
            var(--c2),
            var(--c3),
            var(--c4),
            var(--c5)
          )
          1;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--c1), var(--c5));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        flex-shrink: 0;
        box-shadow:
          0 0 28px rgba(255, 107, 107, 0.5),
          0 0 56px rgba(255, 107, 223, 0.25);
        animation: logoPulse 3s ease-in-out infinite;
      }
      @keyframes logoPulse {
        0%,
        100% {
          box-shadow:
            0 0 28px rgba(255, 107, 107, 0.5),
            0 0 56px rgba(255, 107, 223, 0.25);
        }
        50% {
          box-shadow:
            0 0 40px rgba(77, 150, 255, 0.6),
            0 0 70px rgba(107, 203, 119, 0.3);
        }
      }
      .header-text h1 {
        font-size: 1.35rem;
        font-weight: 900;
        letter-spacing: -0.3px;
        background: linear-gradient(90deg, var(--c1), var(--c2), var(--c4));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .header-text p {
        font-size: 0.7rem;
        color: var(--muted);
        font-family: "Fira Code", monospace;
        letter-spacing: 0.8px;
        margin-top: 1px;
      }
      .status {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(
          135deg,
          rgba(107, 203, 119, 0.15),
          rgba(77, 150, 255, 0.1)
        );
        border: 1.5px solid rgba(107, 203, 119, 0.35);
        padding: 7px 16px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-family: "Fira Code", monospace;
        color: var(--c3);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c3);
        animation: blink 1.6s ease-in-out infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.3;
          transform: scale(0.7);
        }
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 22px 4px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      #messages::-webkit-scrollbar {
        width: 4px;
      }
      #messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .msg-row {
        display: flex;
        gap: 11px;
        animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      @keyframes popIn {
        from {
          opacity: 0;
          transform: scale(0.85) translateY(12px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .msg-row.user {
        flex-direction: row-reverse;
      }

      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 13px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .avatar.bot {
        background: linear-gradient(135deg, var(--c4), var(--c3));
        box-shadow: 0 4px 16px rgba(77, 150, 255, 0.4);
      }
      .avatar.user {
        background: linear-gradient(135deg, var(--c1), var(--c2));
        box-shadow: 0 4px 16px rgba(255, 107, 107, 0.4);
      }

      .bubble {
        max-width: 70%;
        padding: 13px 18px;
        border-radius: var(--r);
        font-size: 0.93rem;
        line-height: 1.7;
        word-break: break-word;
      }
      .msg-row.user .bubble {
        background: linear-gradient(
          135deg,
          var(--c1) 0%,
          #ff8e53 50%,
          var(--c2) 100%
        );
        color: #1a0a00;
        font-weight: 700;
        border-bottom-right-radius: 4px;
        box-shadow: 0 8px 32px rgba(255, 107, 107, 0.45);
      }
      .msg-row.bot .bubble {
        background: var(--card);
        border: 1.5px solid var(--border);
        border-bottom-left-radius: 4px;
        font-family: "Fira Code", monospace;
        font-size: 0.855rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        position: relative;
        overflow: hidden;
      }
      .msg-row.bot .bubble::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(77, 150, 255, 0.07),
          rgba(107, 203, 119, 0.05)
        );
        pointer-events: none;
      }

      .typing-indicator {
        display: flex;
        gap: 6px;
        padding: 8px 4px;
      }
      .typing-indicator span {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        animation: bounce 0.85s ease-in-out infinite;
      }
      .typing-indicator span:nth-child(1) {
        background: var(--c4);
      }
      .typing-indicator span:nth-child(2) {
        background: var(--c5);
        animation-delay: 0.15s;
      }
      .typing-indicator span:nth-child(3) {
        background: var(--c3);
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-9px);
        }
      }

      #welcome {
        margin: auto;
        text-align: center;
        padding: 32px 16px;
        animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .welcome-icon {
        font-size: 4rem;
        margin-bottom: 14px;
        display: inline-block;
        animation: spin 6s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      #welcome h2 {
        font-size: 2rem;
        font-weight: 900;
        margin-bottom: 8px;
        background: linear-gradient(
          90deg,
          var(--c1),
          var(--c2),
          var(--c4),
          var(--c5)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 200%;
        animation: gradShift 3s linear infinite;
      }
      @keyframes gradShift {
        0% {
          background-position: 0%;
        }
        100% {
          background-position: 200%;
        }
      }
      #welcome p {
        color: var(--muted);
        font-size: 0.9rem;
        max-width: 340px;
        margin: 0 auto 26px;
      }
      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        justify-content: center;
      }
      .sug-btn {
        padding: 9px 18px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-family: "Nunito", sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .sug-btn:nth-child(1) {
        background: linear-gradient(135deg, var(--c1), #ff9a6b);
        color: #300;
      }
      .sug-btn:nth-child(2) {
        background: linear-gradient(135deg, var(--c2), #ffb347);
        color: #2a1a00;
      }
      .sug-btn:nth-child(3) {
        background: linear-gradient(135deg, var(--c3), #38d9a9);
        color: #003314;
      }
      .sug-btn:nth-child(4) {
        background: linear-gradient(135deg, var(--c4), #74b9ff);
        color: #00134d;
      }
      .sug-btn:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      #input-area {
        padding: 14px 0 22px;
        border-top: 2px solid transparent;
        border-image: linear-gradient(90deg, var(--c4), var(--c5), var(--c1)) 1;
      }
      .input-shell {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 22px;
        padding: 10px 10px 10px 18px;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
      }
      .input-shell:focus-within {
        border-color: var(--c4);
        box-shadow:
          0 0 0 4px rgba(77, 150, 255, 0.15),
          0 0 32px rgba(77, 150, 255, 0.1);
      }
      #user-input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-family: "Nunito", sans-serif;
        font-size: 0.95rem;
        resize: none;
        max-height: 140px;
        min-height: 24px;
        line-height: 1.55;
        font-weight: 600;
      }
      #user-input::placeholder {
        color: var(--muted);
        font-weight: 400;
      }
      #send-btn {
        width: 44px;
        height: 44px;
        border-radius: 15px;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, var(--c4), var(--c5));
        color: #fff;
        font-size: 19px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 6px 20px rgba(77, 150, 255, 0.5);
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          opacity 0.18s;
      }
      #send-btn:hover:not(:disabled) {
        transform: scale(1.1) rotate(-8deg);
        box-shadow: 0 8px 28px rgba(77, 150, 255, 0.7);
      }
      #send-btn:disabled {
        opacity: 0.3;
        cursor: default;
        transform: none;
      }
      .hint {
        text-align: center;
        margin-top: 9px;
        font-size: 0.68rem;
        color: var(--muted);
        font-family: "Fira Code", monospace;
      }

      #error-toast {
        position: fixed;
        bottom: 95px;
        left: 50%;
        transform: translateX(-50%) translateY(16px);
        background: linear-gradient(135deg, #2d0a0a, #1a0505);
        border: 1.5px solid var(--c1);
        color: var(--c1);
        padding: 10px 22px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-family: "Fira Code", monospace;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s;
        z-index: 999;
        white-space: nowrap;
        box-shadow: 0 8px 32px rgba(255, 107, 107, 0.3);
      }
      #error-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="logo">🌈</div>
        <div class="header-text">
          <h1>Chat IA</h1>
          <p>OLLAMA · LOCAL MODEL</p>
        </div>
        <div class="status"><span class="dot"></span>En línea</div>
      </header>

      <div id="messages">
        <div id="welcome">
          <div class="welcome-icon">✦</div>
          <h2>¡Hola! ¿En qué te ayudo?</h2>
          <p>Hacé tu pregunta o elegí una de estas ideas para arrancar 🚀</p>
          <div class="suggestions">
            <button class="sug-btn" onclick="useSuggestion(this)">
              ¿Qué podés hacer?
            </button>
            <button class="sug-btn" onclick="useSuggestion(this)">
              Escribime un poema
            </button>
            <button class="sug-btn" onclick="useSuggestion(this)">
              Explicame la IA
            </button>
            <button class="sug-btn" onclick="useSuggestion(this)">
              Idea de negocio
            </button>
          </div>
        </div>
      </div>

      <div id="input-area">
        <div class="input-shell">
          <textarea
            id="user-input"
            rows="1"
            placeholder="Escribí tu mensaje… ✨"
          ></textarea>
          <button id="send-btn" onclick="sendMessage()" title="Enviar">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
        <p class="hint">
          ↵ Enter para enviar &nbsp;·&nbsp; Shift+Enter para nueva línea
        </p>
      </div>
    </div>
    <div id="error-toast"></div>

    <script>
      // confetti dots
      const colors = [
        "#ff6b6b",
        "#ffd93d",
        "#6bcb77",
        "#4d96ff",
        "#ff6bdf",
        "#ff9a6b",
        "#74b9ff",
      ];
      for (let i = 0; i < 18; i++) {
        const d = document.createElement("div");
        d.className = "confetti";
        d.style.cssText = `left:${Math.random() * 100}vw;width:${5 + Math.random() * 7}px;height:${5 + Math.random() * 7}px;background:${colors[Math.floor(Math.random() * colors.length)]};opacity:${0.15 + Math.random() * 0.3};animation-duration:${10 + Math.random() * 16}s;animation-delay:${-Math.random() * 20}s;border-radius:${Math.random() > 0.5 ? "50%" : "3px"};`;
        document.body.appendChild(d);
      }

      const API_URL = "http://187.127.253.96:11434/api/generate";
      const MODEL = "llama3.2:3b";

      const messagesEl = document.getElementById("messages");
      const inputEl = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const errorToast = document.getElementById("error-toast");
      let welcome = document.getElementById("welcome");
      let isStreaming = false;

      inputEl.addEventListener("input", () => {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
      });
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      function useSuggestion(btn) {
        inputEl.value = btn.textContent.trim();
        inputEl.dispatchEvent(new Event("input"));
        sendMessage();
      }

      function appendMessage(role, text) {
        if (welcome) {
          welcome.remove();
          welcome = null;
        }
        const row = document.createElement("div");
        row.className = `msg-row ${role}`;
        const av = document.createElement("div");
        av.className = `avatar ${role}`;
        av.textContent = role === "user" ? "😊" : "🤖";
        const bub = document.createElement("div");
        bub.className = "bubble";
        bub.textContent = text;
        row.append(av, bub);
        messagesEl.appendChild(row);
        scrollBottom();
        return bub;
      }

      function showTyping() {
        const row = document.createElement("div");
        row.className = "msg-row bot";
        row.id = "typing-row";
        const av = document.createElement("div");
        av.className = "avatar bot";
        av.textContent = "🤖";
        const bub = document.createElement("div");
        bub.className = "bubble";
        bub.innerHTML =
          '<div class="typing-indicator"><span></span><span></span><span></span></div>';
        row.append(av, bub);
        messagesEl.appendChild(row);
        scrollBottom();
      }
      function removeTyping() {
        const t = document.getElementById("typing-row");
        if (t) t.remove();
      }
      function scrollBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      function showError(msg) {
        errorToast.textContent = msg;
        errorToast.classList.add("show");
        setTimeout(() => errorToast.classList.remove("show"), 4500);
      }

      async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || isStreaming) return;
        isStreaming = true;
        sendBtn.disabled = true;
        inputEl.value = "";
        inputEl.style.height = "auto";
        appendMessage("user", text);
        showTyping();
        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: MODEL, prompt: text, stream: true }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          removeTyping();
          const botBub = appendMessage("bot", "");
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let full = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const lines = dec
              .decode(value, { stream: true })
              .split("\n")
              .filter((l) => l.trim());
            for (const line of lines) {
              try {
                const j = JSON.parse(line);
                if (j.response) {
                  full += j.response;
                  botBub.textContent = full;
                  scrollBottom();
                }
              } catch (_) {}
            }
          }
        } catch (err) {
          removeTyping();
          showError("⚡ No se pudo conectar. ¿Está corriendo Ollama?");
          appendMessage(
            "bot",
            "⚠️ Error al conectar con el servidor. Verificá que Ollama esté activo.",
          );
        }
        isStreaming = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    </script>
  </body>
</html>
